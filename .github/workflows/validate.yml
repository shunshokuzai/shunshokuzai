name: Validate code and official price sources
on:
  push:
    branches: ['codex/**']
    paths: ['data/recipes.json', 'shopping.js', 'data/topic_catalog.json', 'scripts/**', 'tests/**', 'app.js', 'requirements.txt', '.github/workflows/validate.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/preflight.py
      - run: node --check app.js && node --check search.js && node --check shopping.js
      - run: node --test tests/test_ui.cjs tests/test_shopping.cjs
  official-prices:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit unmapped official commodities
        run: python -u scripts/audit_sources.py
      - name: Verify official data without Gemini requests
        run: python -u scripts/verify_prices.py
      - name: Verify official retail observations and source specifications
        run: python -u scripts/retail_prices.py --live --require-cities
      - name: Verify expanded public topic sources without Gemini requests
        env:
          SOURCES_ONLY: 'true'
          MAX_DISCOVERY_ARTICLES: '24'
        run: python -u scripts/update_topics.py --live
      - name: Verify and retain cause explanations against the actual reported source pages
        run: python -u scripts/verify_cause_sources.py --live
      - name: Verify source allocation, retail provenance and recipe ingredients
        run: python scripts/verify_extensions.py
      - name: Backfill official five-year history without AI
        run: python -u scripts/backfill_history.py --live --limit 600
      - name: Recover restricted historical periods from public daily originals
        run: python -u scripts/estat_history.py --live --limit 1200 --seconds 650
      - name: Check historical coverage and alternate official sources
        run: python -u scripts/verify_history.py
      - name: Check every published price point against its official archive
        run: python -u scripts/verify_consistency.py
      - run: python scripts/build_standalone.py
      - name: Retain verified observations on development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_regions.json data/retail_prices.json data/topic_monitor.json data/estat_daily.json data/market_history.json data/seed.json data.js '旬食材まるわかり_プロトタイプ.html'
          if ! git diff --cached --quiet; then
            git commit -m 'data: retain validated official market history'
            git push
          fi

  browser-preview:
    if: github.event_name == 'push'
    needs: official-prices
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install 'playwright==1.65.1'
          python -m playwright install --with-deps chromium
      - name: Check the complete candidate app before deployment
        run: |
          python scripts/build_site.py
          python -m http.server 8765 --directory site > /tmp/shun-preview.log 2>&1 &
          PUBLIC_APP_URL=http://127.0.0.1:8765/ python -u scripts/verify_public_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-app-ui
          path: ui-results
          retention-days: 7
