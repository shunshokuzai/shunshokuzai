name: Validate code and official price sources
on:
  push:
    branches: ['codex/**']
    paths: ['scripts/**', 'tests/**', 'app.js', 'requirements.txt', '.github/workflows/validate.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/preflight.py
      - run: node --check app.js && node --check search.js
      - run: node --test tests/test_ui.cjs
  official-prices:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit unmapped official commodities
        run: python -u scripts/audit_sources.py
      - name: Verify official data without Gemini requests
        run: python -u scripts/verify_prices.py
      - name: Verify expanded public topic sources without Gemini requests
        env:
          SOURCES_ONLY: 'true'
        run: python -u scripts/update_topics.py --live
      - name: Backfill official five-year history without AI
        run: python -u scripts/backfill_history.py --live --limit 600
      - name: Recover restricted historical periods from public daily originals
        run: python -u scripts/estat_history.py --limit 1200
      - name: Check historical coverage and alternate official sources
        run: python -u scripts/verify_history.py
      - name: Check every published price point against its official archive
        run: python -u scripts/verify_consistency.py
      - run: python scripts/build_standalone.py
      - name: Retain verified observations on development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/estat_daily.json data/market_history.json data/seed.json data.js '旬食材まるわかり_プロトタイプ.html'
          if ! git diff --cached --quiet; then
            git commit -m 'data: retain validated official market history'
            git push
          fi
