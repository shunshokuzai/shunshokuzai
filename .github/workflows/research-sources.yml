name: Inspect official retail and production source formats
on:
  push:
    branches: ['codex/national-retail-recipes-20261115']
    paths: ['scripts/probe_sources.py', '.github/workflows/research-sources.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 openpyxl xlrd
      - run: python -u scripts/probe_sources.py
